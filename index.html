<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengeluaran Realtime</title>

<style>
body{
font-family:Arial;
background:#f3f4f6;
padding:15px;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:#f9fafb;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.total{
font-size:28px;
font-weight:bold;
color:red;
}

.month{
color:blue;
}

input{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
background:#f3f4f6;
border-radius:10px;
margin-top:8px;
}
</style>
</head>
<body>

<div class="box">

<h1>💸 Pengeluaran Realtime</h1>

<div class="card">
<h3>Total Hari Ini</h3>
<div class="total" id="harian">Rp0</div>
</div>

<div class="card">
<h3>Total Bulan Ini</h3>
<div class="total month" id="bulanan">Rp0</div>
</div>

<input type="text" id="nama" placeholder="Nama Pengeluaran">

<input type="number" id="jumlah" placeholder="Jumlah">

<button onclick="tambah()">Tambah</button>

<div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {
apiKey: "AIzaSyAD8NyqcxooL2ga3dG918kYufrOn-5ZMwI",
authDomain: "pengeluaran-c2c6d.firebaseapp.com",
databaseURL: "https://pengeluaran-c2c6d-default-rtdb.asia-southeast1.firebasedatabase.app/",
projectId: "pengeluaran-c2c6d",
storageBucket: "pengeluaran-c2c6d.firebasestorage.app",
messagingSenderId: "385326707991",
appId: "1:385326707991:web:dd833732ad3b60e1d93352"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

/* TANGGAL */

const now = new Date();

const bulan =
now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,'0');

const hari =
bulan+"-"+String(now.getDate()).padStart(2,'0');

/* REF */

const refHarian =
ref(db,"pengeluaran/"+bulan+"/"+hari);

const refBulanan =
ref(db,"pengeluaran/"+bulan);

/* FORMAT */

function rupiah(angka){
return "Rp"+angka.toLocaleString("id-ID");
}

/* TAMBAH DATA */

window.tambah = function(){

const nama =
document.getElementById("nama").value;

const jumlah =
parseInt(document.getElementById("jumlah").value);

if(!nama || !jumlah){
alert("Lengkapi data");
return;
}

const newData = push(refHarian);

set(newData,{
nama:nama,
jumlah:jumlah,
waktu:Date.now()
});

document.getElementById("nama").value="";
document.getElementById("jumlah").value="";

}

/* REALTIME HARIAN */

onValue(refHarian,(snapshot)=>{

let total = 0;

let html = "";

snapshot.forEach((child)=>{

const data = child.val();

if(data.jumlah){

total += data.jumlah;

html += `
<div class="item">
<span>${data.nama}</span>
<b>${rupiah(data.jumlah)}</b>
</div>
`;

}

});

document.getElementById("harian").innerHTML =
rupiah(total);

document.getElementById("list").innerHTML =
html;

});

/* REALTIME BULANAN */

onValue(refBulanan,(snapshot)=>{

let totalBulanan = 0;

snapshot.forEach((tanggal)=>{

tanggal.forEach((item)=>{

const data = item.val();

if(data.jumlah){
totalBulanan += data.jumlah;
}

});

});

document.getElementById("bulanan").innerHTML =
rupiah(totalBulanan);

});
/* REALTIME HARIAN */

onValue(refHarian,(snapshot)=>{

let total = 0;

let html = "";

snapshot.forEach((child)=>{

const data = child.val();

if(data.jumlah){

total += data.jumlah;

html += `
<div class="item">
<span>${data.nama}</span>
<b>${rupiah(data.jumlah)}</b>
</div>
`;

}

});

document.getElementById("harian").innerHTML =
rupiah(total);

document.getElementById("list").innerHTML =
html;

});

/* REALTIME BULANAN */

onValue(refBulanan,(snapshot)=>{

let totalBulanan = 0;

snapshot.forEach((tanggal)=>{

tanggal.forEach((item)=>{

const data = item.val();

if(data.jumlah){
totalBulanan += data.jumlah;
}

});

});

document.getElementById("bulanan").innerHTML =
rupiah(totalBulanan);

});

</script>

</body>
</html>
