<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengeluaran Realtime</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f5f9;
padding:15px;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:30px;
color:#0f172a;
}

.card{
background:#f8fafc;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.card h3{
font-size:17px;
margin-bottom:10px;
color:#475569;
}

.total{
font-size:40px;
font-weight:bold;
color:#ef4444;
}

.month{
color:#2563eb;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:10px;
font-size:16px;
font-weight:bold;
color:#334155;
}

.input-box{
display:flex;
align-items:center;
background:white;
border:2px solid #e2e8f0;
border-radius:18px;
padding:0 15px;
transition:0.2s;
}

.input-box:focus-within{
border-color:#2563eb;
box-shadow:0 0 10px rgba(37,99,235,0.15);
}

.input-box span{
font-size:22px;
margin-right:10px;
}

.input-box input{
width:100%;
padding:16px 0;
border:none;
outline:none;
font-size:17px;
background:none;
}

button{
width:100%;
padding:16px;
background:#2563eb;
color:white;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(0.98);
background:#1d4ed8;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#f8fafc;
border-radius:18px;
margin-top:12px;
font-size:18px;
animation:muncul 0.3s ease;
}

.item-name{
font-weight:bold;
color:#0f172a;
}

.item-price{
font-size:22px;
font-weight:bold;
color:#ef4444;
}

#notif{
position:fixed;
top:20px;
right:20px;
background:#22c55e;
color:white;
padding:15px 20px;
border-radius:15px;
font-weight:bold;
display:none;
z-index:999;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
animation:slide 0.3s ease;
}

@keyframes slide{
from{
transform:translateY(-20px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes muncul{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>
<body>

<div id="notif">
✅ Pengeluaran berhasil ditambahkan
</div>

<div class="box">

<h1>💸 Pengeluaran Realtime</h1>

<div class="card">
<h3>Total Hari Ini</h3>
<div class="total" id="harian">Rp0</div>
</div>

<div class="card">
<h3>Total Bulan Ini</h3>
<div class="total month" id="bulanan">Rp0</div>
</div>

<div class="input-group">

<label>Nama Pengeluaran</label>

<div class="input-box">
<span>📝</span>
<input type="text" id="nama" placeholder="Contoh : Jajan">
</div>

</div>

<div class="input-group">

<label>Jumlah Pengeluaran</label>

<div class="input-box">
<span>💰</span>
<input type="number" id="jumlah" placeholder="Contoh : 10000">
</div>

</div>

<button onclick="tambah()">
Tambah Pengeluaran
</button>

<div id="list"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyAD8NyqcxooL2ga3dG918kYufrOn-5ZMwI",

authDomain: "pengeluaran-c2c6d.firebaseapp.com",

databaseURL:
"https://pengeluaran-c2c6d-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId: "pengeluaran-c2c6d",

storageBucket:
"pengeluaran-c2c6d.firebasestorage.app",

messagingSenderId: "385326707991",

appId:
"1:385326707991:web:dd833732ad3b60e1d93352"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

/* TANGGAL */

const now = new Date();

const bulan =
now.getFullYear() + "-" +
String(now.getMonth()+1).padStart(2,'0');

const hari =
bulan + "-" +
String(now.getDate()).padStart(2,'0');

/* DATABASE */

const refHarian =
ref(db,"pengeluaran/"+bulan+"/"+hari);

const refBulanan =
ref(db,"pengeluaran/"+bulan);

/* FORMAT RUPIAH */

function rupiah(angka){

return "Rp" + angka.toLocaleString("id-ID");

}

/* TAMBAH DATA */

window.tambah = function(){

const nama =
document.getElementById("nama").value;

const jumlah =
parseInt(document.getElementById("jumlah").value);

if(!nama || !jumlah){

alert("Lengkapi data!");

return;

}

const newData = push(refHarian);

set(newData,{

nama:nama,
jumlah:jumlah,
waktu:Date.now()

});

/* NOTIFIKASI */

const notif =
document.getElementById("notif");

notif.style.display = "block";

setTimeout(()=>{

notif.style.display = "none";

},2000);

/* RESET INPUT */

document.getElementById("nama").value = "";

document.getElementById("jumlah").value = "";

}

/* REALTIME HARIAN */

onValue(refHarian,(snapshot)=>{

let total = 0;

let html = "";

snapshot.forEach((child)=>{

const data = child.val();

if(data.jumlah){

total += data.jumlah;

/* DATA TERBARU PALING ATAS */

html = `
<div class="item">

<div class="item-name">
${data.nama}
</div>

<div class="item-price">
${rupiah(data.jumlah)}
</div>

</div>
` + html;

}

});

document.getElementById("harian").innerHTML =
rupiah(total);

document.getElementById("list").innerHTML =
html;

});

/* REALTIME BULANAN */

onValue(refBulanan,(snapshot)=>{

let totalBulanan = 0;

snapshot.forEach((tanggal)=>{

tanggal.forEach((item)=>{

const data = item.val();

if(data.jumlah){

totalBulanan += data.jumlah;

}

});

});

document.getElementById("bulanan").innerHTML =
rupiah(totalBulanan);

});

</script>

</body>
</html>
